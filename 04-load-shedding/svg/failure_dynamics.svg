"#E6EDF7" class="text-mono-bold" style="text-anchor:middle;font-size:16px"><tspan x="490.5" dy="0">latency crosses the client&#39;s timeout:</tspan><tspan x="490.5" dy="18.5">throughput stays high, goodput collapses</tspan></text></g><g class="YzA= bad"><g class="shape" ><rect x="0" y="218" width="227" height="82" rx="10" stroke="#FF4C6E" fill="#131B30" style="stroke-width:2;" /></g><text x="113.5" y="264.5" fill="#E6EDF7" class="text-mono-bold" style="text-anchor:middle;font-size:16px">3 · shared resource</text></g><g class="YzE= svc"><g class="shape" ><rect x="239" y="218" width="503" height="82" rx="10" stroke="#5B7CBA" fill="#131B30" style="stroke-width:2;" /></g><text x="490.5" y="256.5" fill="#E6EDF7" class="text-mono-bold" style="text-anchor:middle;font-size:16px"><tspan x="490.5" dy="0">threads and queues fill;</tspan><tspan x="490.5" dy="18.5">retries multiply the offered load</tspan></text></g><g class="ZDA= ok"><g class="shape" ><rect x="0" y="312" width="227" height="82" rx="10" stroke="#3DDB96" fill="#131B30" style="stroke-width:2;" /></g><text x="113.5" y="358.5" fill="#E6EDF7" class="text-mono-bold" style="text-anchor:middle;font-size:16px">4 · containment</text></g><g class="ZDE= ok"><g class="shape" ><rect x="239" y="312" width="503" height="82" rx="10" stroke="#3DDB96" fill="#131B30" style="stroke-width:2;" /></g><text x="490.5" y="350.5" fill="#E6EDF7" class="text-mono-bold" style="text-anchor:middle;font-size:16px"><tspan x="490.5" dy="0">shed by priority, newest first,</tspan><tspan x="490.5" dy="18.5">within an adaptive limit, as early as you can</tspan></text></g><g class="ZTA= ext"><g class="shape" ><rect x="0" y="406" width="227" height="82" rx="10" stroke="#8C9EBF" fill="#12192E" style="stroke-width:2;stroke-dasharray:8.000000,7.892511;" /></g><text x="113.5" y="452.5" fill="#8C9EBF" class="text-mono-bold" style="text-anchor:middle;font-size:16px">5 · trade-off</text></g><g class="ZTE= ext"><g class="shape" ><rect x="239" y="406" width="503" height="82" rx="10" stroke="#8C9EBF" fill="#12192E" style="stroke-width:2;stroke-dasharray:8.000000,7.892511;" /></g><text x="490.5" y="444.5" fill="#8C9EBF" class="text-mono-bold" style="text-anchor:middle;font-size:16px"><tspan x="490.5" dy="0">some requests are refused on purpose;</tspan><tspan x="490.5" dy="18.5">overall availability drifts down</tspan></text></g><g class="ZjA= ok"><g class="shape" ><rect x="0" y="500" width="227" height="66" rx="10" stroke="#3DDB96" fill="#131B30" style="stroke-width:2;" /></g><text x="113.5" y="538.5" fill="#E6EDF7" class="text-mono-bold" style="text-anchor:middle;font-size:16px">6 · recovery</text></g><g class="ZjE= ok"><g class="shape" ><rect x="239" y="500" width="503" height="66" rx="10" stroke="#3DDB96" fill="#131B30" style="stroke-width:2;" /></g><text x="490.5" y="538.5" fill="#E6EDF7" class="text-mono-bold" style="text-anchor:middle;font-size:16px">goodput holds, then load ramps back gradually</text></g><mask id="d2-2161188978" maskUnits="userSpaceOnUse" x="-41" y="-41" width="824" height="648">
<rect x="-41" y="-41" width="824" height="648" fill="white"></rect>

