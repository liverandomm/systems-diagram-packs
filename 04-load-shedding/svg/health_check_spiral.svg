		.d2-1653526867 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="czQ= svc"><g class="shape" ><rect x="217" y="12" width="256" height="82" rx="10" stroke="#5B7CBA" fill="#131B30" style="stroke-width:2;" /></g><text x="345" y="50.5" fill="#E6EDF7" class="text-mono-bold" style="text-anchor:middle;font-size:16px"><tspan x="345" dy="0">4 servers take traffic</tspan><tspan x="345" dy="18.5">(ILLUSTRATIVE count)</tspan></text></g><g class="czM= warn"><g class="shape" ><rect x="140" y="164" width="409" height="82" rx="10" stroke="#FFB803" fill="#131B30" style="stroke-width:2;" /></g><text x="344.5" y="202.5" fill="#E6EDF7" class="text-mono-bold" style="text-anchor:middle;font-size:16px"><tspan x="344.5" dy="0">one overloaded server misses LB pings</tspan><tspan x="344.5" dy="18.5">LB stops sending it work: it sits idle</tspan></text></g><g class="czI= bad"><g class="shape" ><rect x="179" y="417" width="331" height="82" rx="10" stroke="#FF4C6E" fill="#131B30" style="stroke-width:2;" /></g><text x="344.5" y="455.5" fill="#E6EDF7" class="text-mono-bold" style="text-anchor:middle;font-size:16px"><tspan x="344.5" dy="0">fewer servers, more load each:</tspan><tspan x="344.5" dy="18.5">the ones left overload faster</tspan></text></g><g class="Zml4 ok"><g class="shape" ><rect x="69" y="569" width="552" height="98" rx="10" stroke="#3DDB96" fill="#131B30" style="stroke-width:2;" /></g><text x="345" y="607.5" fill="#E6EDF7" class="text-mono-bold" style="text-anchor:middle;font-size:16px"><tspan x="345" dy="0">fix: LB pings go to the front of the line</tspan><tspan x="345" dy="17.666667">&#34;in a brownout scenario, the last thing we want to do</tspan><tspan x="345" dy="17.666667">is to reduce the size of our fleets&#34; (AWS)</tspan></text></g><g class="dHdv focus"><g class="shape" ><rect x="12" y="737" width="666" height="114" rx="10" stroke="#4CC9F0" fill="#131B30" style="stroke-width:3;" /></g><text x="345" y="775.5" fill="#E6EDF7" class="text-mono-bold" style="text-anchor:middle;font-size:16px"><tspan x="345" dy="0">two questions (Google):</tspan><tspan x="345" dy="17.25">process alive?  -&gt; scheduler</tspan><tspan x="345" dy="17.25">can serve this kind of request now?  -&gt; load balancer</tspan><tspan x="345" dy="17.25">a server that&#39;s shedding is still serving. Answer both, honestly.</tspan></text></g><g class="KHM0IC0mZ3Q7IHMzKVswXQ=="><marker id="mk-d2-1653526867-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#0D32B2" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 345 96 L 345 160" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1653526867-3488378134)" mask="url(#d2-1653526867)" /></g><g class="KHMzIC0mZ3Q7IHMyKVswXQ=="><path d="M 289.833008 248 L 289.833008 413" stroke="#0D32B2" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1653526867-3488378134)" mask="url(#d2-1653526867)" /></g><g class="KHMyIC0mZ3Q7IHMzKVswXQ=="><marker id="mk-d2-1653526867-1982654440" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" fill="#FF4C6E" class="connection" stroke-width="2" /> </marker><path d="M 413.165985 415 L 413.165985 250" stroke="#FF4C6E" fill="none" class="connection" style="stroke-width:2;stroke-dasharray:8.000000,7.892511;" marker-end="url(#mk-d2-1653526867-1982654440)" mask="url(#d2-