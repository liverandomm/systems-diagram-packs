		.d2-2832579861 .stroke-B2{stroke:#0D32B2;}.appendix text.text{fill:#0A0F25}.md{--color-fg-default:#0A0F25;--color-fg-muted:#676C7E;--color-fg-subtle:#9499AB;--color-canvas-default:#FFFFFF;--color-canvas-subtle:#EEF1F8;--color-border-default:#0D32B2;--color-border-muted:#0D32B2;--color-neutral-muted:#EEF1F8;--color-accent-fg:#0D32B2;--color-accent-emphasis:#0D32B2;--color-attention-subtle:#676C7E;--color-danger-fg:red;}.light-code{display: block}.dark-code{display: none}]]></style><g class="c2Vx"><g class="shape" ><rect x="16" y="12" width="570" height="712" stroke="#5B7CBA" fill="#0B1020" style="stroke-width:0;" /></g><text x="301" y="45" fill="#4CC9F0" class="text-mono" style="text-anchor:middle;font-size:28px">hedged request</text></g><g class="bm90ZQ== note"><g class="shape" ></g><text x="301" y="807" fill="#8C9EBF" class="text-mono" style="text-anchor:middle;font-size:14px"><tspan x="301" dy="0">Waiting for the p95 before hedging limits the extra load to about 5%.</tspan><tspan x="301" dy="15">Google benchmark (2013): p99.9 1,800 ms to 74 ms with +2% requests</tspan><tspan x="301" dy="15">(hedge after 10 ms, 1,000 keys on 100 servers).</tspan><tspan x="301" dy="15">Our rule: hedge when you have headroom, shed when you don&#39;t.</tspan></text></g><g class="c2VxLmNsaWVudA== svc"><g class="shape" ><rect x="28" y="100" width="101" height="66" rx="10" stroke="#5B7CBA" fill="#131B30" style="stroke-width:2;" /></g><text x="78.5" y="138.5" fill="#E6EDF7" class="text-mono" style="text-anchor:middle;font-size:16px">client</text></g><g class="c2VxLnIx svc"><g class="shape" ><rect x="276" y="100" width="129" height="66" rx="10" stroke="#5B7CBA" fill="#131B30" style="stroke-width:2;" /></g><text x="340.5" y="138.5" fill="#E6EDF7" class="text-mono" style="text-anchor:middle;font-size:16px">replica 1</text></g><g class="c2VxLnIy svc"><g class="shape" ><rect x="445" y="100" width="129" height="66" rx="10" stroke="#5B7CBA" fill="#131B30" style="stroke-width:2;" /></g><text x=